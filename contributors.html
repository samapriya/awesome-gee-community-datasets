<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome GEE Community Leaderboard</title>
  <meta name="description" content="Contributors to the Awesome GEE Community Catalog.">
  <link rel="icon"
    href="https://user-images.githubusercontent.com/6677629/193518988-956b9571-169d-4a79-89a8-d347d46c1af7.png">

  <!--
    Original look and feel, rebuilt without the framework stack.
    Previously this page loaded React, ReactDOM, framer-motion (esm.sh),
    @babel/standalone and the Tailwind CDN — roughly a megabyte of JS, and two
    build-time jobs run on the visitor's main thread before first paint:
    Babel compiling the JSX, and Tailwind's JIT scanning the DOM to generate
    CSS. All of it is gone; the design is unchanged.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin>
  <!-- Same families as before, trimmed from 17 weights to 5. Material Symbols
       is dropped entirely — the five icons it was loaded for are inline SVG. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Montserrat:wght@700;800&display=swap">

  <!-- Start both fetches during head parsing, not after the script runs. -->
  <link rel="preload" href="/issues-summary.json" as="fetch">
  <link rel="preload" href="/repo-stats.json" as="fetch">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G7SXDJEWXV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-G7SXDJEWXV');
  </script>

  <script>
    // Applied before first paint so dark mode never flashes light first.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { }
  </script>

  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --card: #ffffff;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --accent: #2563eb;
      --emerald: #10b981;
      --violet: #8b5cf6;
      --panel: rgba(255, 255, 255, .7);
      --panel-border: rgba(255, 255, 255, .5);
      --sticky: rgba(255, 255, 255, .85);
      --sticky-border: rgba(226, 232, 240, .6);
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-lg: 0 12px 24px -10px rgba(15, 23, 42, .18);
    }

    html.dark {
      --bg: #0b1120;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --faint: #64748b;
      --card: #1e293b;
      --line: #334155;
      --line-soft: #172033;
      --accent: #60a5fa;
      --emerald: #34d399;
      --violet: #a78bfa;
      --panel: rgba(30, 41, 59, .7);
      --panel-border: rgba(255, 255, 255, .05);
      --sticky: rgba(15, 23, 42, .85);
      --sticky-border: rgba(51, 65, 85, .5);
      --shadow: 0 1px 3px rgba(0, 0, 0, .3);
      --shadow-lg: 0 12px 24px -10px rgba(0, 0, 0, .55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }

    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .heading { font-family: Montserrat, Inter, sans-serif; }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 80rem; margin: 0 auto; padding: 0 1rem; }

    @media (min-width: 640px) { .wrap { padding: 0 1.5rem; } }
    @media (min-width: 1024px) { .wrap { padding: 0 2rem; } }

    /* ---------- hero ---------- */
    .hero {
      max-width: 77.5rem;
      margin: 2.5rem auto 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      padding: 3.5rem 3.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      box-shadow: 0 24px 60px -30px rgba(15, 23, 42, .25);
    }

    html.dark .hero { box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .6); }

    .hero__logo { width: 300px; max-width: 80%; height: auto; }

    .hero__title {
      margin: 0;
      font-family: Montserrat, Inter, sans-serif;
      font-size: 2.75rem;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -.03em;
      text-align: center;
    }

    .hero__title span {
      background-image: linear-gradient(90deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    html.dark .hero__title span {
      background-image: linear-gradient(90deg, #60a5fa, #a78bfa);
    }

    .hero__sub {
      margin: 0;
      font-size: 1.06rem;
      color: var(--muted);
      text-align: center;
      max-width: 35rem;
    }

    .hero__sub strong { font-weight: 700; color: var(--fg); }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.4rem;
      padding: .9rem 1.4rem;
      border-radius: 1.25rem;
      background: var(--bg);
      border: 1px solid var(--line-soft);
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .5rem .9rem;
      border-radius: .875rem;
      background: var(--card);
      border: 1px solid var(--line);
      transition: border-color .2s ease;
    }

    .stat-card:hover { border-color: var(--accent); }

    .stat-card__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.125rem;
      height: 2.125rem;
      border-radius: .625rem;
      color: #fff;
      flex-shrink: 0;
    }

    .stat-card__icon svg { width: 1.2rem; height: 1.2rem; }
    .stat-card__text { display: flex; flex-direction: column; }

    .stat-card__value { font-size: 1.25rem; line-height: 1.1; font-weight: 700; }

    .stat-card__label {
      font-size: .625rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .stats__divider { width: 1px; height: 2.375rem; background: var(--line); }

    .stat-inline { display: flex; align-items: center; gap: .5rem; transition: opacity .2s ease; }
    .stat-inline:hover { opacity: .75; }
    .stat-inline svg { width: 1.2rem; height: 1.2rem; flex-shrink: 0; }
    .stat-inline b { font-size: 1rem; font-weight: 700; color: var(--fg); }
    .stat-inline .lbl { font-size: .75rem; color: var(--faint); }

    @media (max-width: 56rem) {
      .hero { padding: 2.5rem 1.5rem 2rem; margin: 1.25rem; border-radius: 1.25rem; }
      .hero__title { font-size: 2rem; }
      .stats__divider { display: none; }
    }

    /* ---------- sticky toolbar ---------- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin-top: 1.5rem;
      background: var(--sticky);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--sticky-border);
    }

    .controls { padding-top: 1rem; }

    /* ---------- controls ---------- */
    .controls {
      display: flex;
      gap: .75rem;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 1rem;
    }

    .search { position: relative; flex: 1 1 16rem; min-width: 12rem; }

    .search svg {
      position: absolute;
      left: .7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      padding: .55rem .8rem .55rem 2.2rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: .85rem;
      box-shadow: var(--shadow);
    }

    .search input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: transparent;
    }

    .group {
      display: flex;
      gap: .2rem;
      background: var(--line-soft);
      padding: .25rem;
      border-radius: .75rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .group::-webkit-scrollbar { display: none; }

    .group button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .75rem;
      font-weight: 700;
      padding: .4rem .75rem;
      border-radius: .5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, background-color .2s;
    }

    .group button:hover { color: var(--fg); }

    .group button[aria-pressed="true"] {
      background: var(--card);
      color: var(--accent);
      box-shadow: var(--shadow);
    }

    .icon-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: .75rem;
      padding: .5rem;
      cursor: pointer;
      display: inline-flex;
      line-height: 0;
      box-shadow: var(--shadow);
    }

    .icon-btn:hover { color: var(--fg); }

    /* ---------- cards ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
      gap: 1.5rem;
      padding: 2rem 0;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: box-shadow .25s ease, transform .25s ease;
      /* Skips layout and paint for offscreen cards. With 200+ contributors
         this is the single biggest scrolling win. */
      content-visibility: auto;
      contain-intrinsic-size: 16rem;
    }

    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

    .who { display: flex; gap: .85rem; align-items: center; margin-bottom: 1rem; }

    .av-wrap { position: relative; flex-shrink: 0; }

    .av {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: .85rem;
      object-fit: cover;
      background: var(--line-soft);
      display: block;
    }

    .badge {
      position: absolute;
      right: -.5rem;
      bottom: -.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: .5rem;
      padding: .1rem .35rem;
      min-width: 1.5rem;
      text-align: center;
      font-size: .7rem;
      font-weight: 800;
      color: var(--accent);
      box-shadow: var(--shadow);
    }

    .name {
      font-family: Montserrat, Inter, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .who a:hover .name { color: var(--accent); }
    .login { font-size: .72rem; font-weight: 500; color: var(--muted); margin: .1rem 0 0; }

    .stat {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .78rem;
      padding: .3rem 0;
    }

    .dot { width: .5rem; height: .5rem; border-radius: 50%; flex-shrink: 0; }
    .stat .label { color: var(--muted); flex: 1; font-weight: 500; }
    .stat .v { font-weight: 700; }
    .stat .k { color: var(--faint); font-size: .68rem; }

    .foot {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .72rem;
    }

    .foot .k {
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 700;
      font-size: .66rem;
    }

    /* ---------- states ---------- */
    .skel { background: var(--line-soft); border-radius: .5rem; }
    @keyframes pulse { 50% { opacity: .5; } }
    .pulse { animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }

    .empty { grid-column: 1/-1; text-align: center; padding: 5rem 1rem; }

    .empty-icon {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: var(--line-soft);
      color: var(--faint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .empty h3 { font-family: Montserrat, Inter, sans-serif; margin: 0 0 .25rem; }
    .empty p { color: var(--muted); margin: 0; }

    #sentinel { min-height: 5rem; display: grid; place-items: center; }

    .tail {
      margin: 0;
      font-size: .78rem;
      font-weight: 600;
      color: var(--faint);
      text-align: center;
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 4px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      color: var(--faint);
      font-size: .75rem;
      padding: 2.5rem 1rem;
    }

    footer p { margin: .35rem 0; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <img class="hero__logo" src="https://i.imgur.com/FYPcTFF.png"
         alt="Awesome GEE Community Catalog" width="300" height="90" fetchpriority="high">
    <h1 class="hero__title">Community <span>Leaderboard</span></h1>
    <p class="hero__sub">Celebrating the minds behind the
      <strong>Awesome GEE Community Catalog</strong>.</p>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-card__icon" style="background:#2563eb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span class="stat-card__text">
          <span class="stat-card__value mono" id="stat-contributors">&mdash;</span>
          <span class="stat-card__label">Contributors</span>
        </span>
      </div>
      <div class="stat-card">
        <span class="stat-card__icon" style="background:#7c3aed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </span>
        <span class="stat-card__text">
          <span class="stat-card__value mono" id="stat-contributions">&mdash;</span>
          <span class="stat-card__label">Contributions</span>
        </span>
      </div>

      <div class="stats__divider"></div>

      <div class="stat-inline">
        <svg style="color:#f59e0b" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <b class="mono" id="stat-stars">&mdash;</b><span class="lbl">Stars</span>
      </div>
      <div class="stat-inline">
        <svg style="color:#3b82f6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 9v6M18 9a9 9 0 0 1-9 9"/></svg>
        <b class="mono" id="stat-forks">&mdash;</b><span class="lbl">Forks</span>
      </div>
      <div class="stat-inline">
        <svg style="color:#f43f5e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        <b class="mono" id="stat-open">&mdash;</b><span class="lbl">Open issues</span>
      </div>
      <div class="stat-inline">
        <svg style="color:#10b981" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 13 4 4L14 7M13 16l2 2 7-9"/></svg>
        <b class="mono" id="stat-closed">&mdash;</b><span class="lbl">Closed</span>
      </div>
      <div class="stat-inline">
        <svg style="color:#8b5cf6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M2 12h6.5M15.5 12H22"/></svg>
        <b class="mono" id="stat-prs">&mdash;</b><span class="lbl">PRs</span>
      </div>
    </div>
  </header>

  <header class="toolbar">
    <div class="wrap">
      <div class="controls">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="q" type="search" placeholder="Find a contributor…" autocomplete="off"
            aria-label="Search contributors">
        </div>
        <div class="group" id="years" role="group" aria-label="Filter by year"></div>
        <div class="group" id="sorts" role="group" aria-label="Sort by">
          <button data-sort="count" aria-pressed="true">Activity</button>
          <button data-sort="recent" aria-pressed="false">Recent</button>
          <button data-sort="az" aria-pressed="false">A&ndash;Z</button>
        </div>
        <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <div id="sentinel" hidden><div class="spinner"></div></div>
  </main>

  <footer>
    <p>Data provided by Awesome GEE Community Catalog.</p>
    <p>Built with <span style="color:#ef4444">&hearts;</span> for the GEE Community</p>
  </footer>

  <script>
    (function () {
      'use strict';

      function fatal(msg) {
        var g = document.getElementById('grid');
        var s = document.getElementById('sentinel');
        if (s) s.hidden = true;
        if (g) {
          g.innerHTML = '<div class="empty"><h3>Could not load contributors</h3>' +
            '<p style="font-family:monospace;font-size:.72rem">' +
            String(msg).replace(/[<>&]/g, '') + '</p></div>';
        }
      }

      // Anything thrown outside the promise chain — event handlers, the
      // requestAnimationFrame loop — would otherwise vanish into the console
      // and leave the spinner turning forever.
      window.addEventListener('error', function (e) {
        fatal((e.message || 'Script error') + (e.lineno ? ' @ line ' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        fatal('Unhandled: ' + ((e.reason && e.reason.message) || e.reason));
      });

      var PAGE = 24;
      var grid = document.getElementById('grid');
      var sentinel = document.getElementById('sentinel');
      var qEl = document.getElementById('q');
      var yearsEl = document.getElementById('years');
      var sortsEl = document.getElementById('sorts');

      var all = [], view = [], shown = 0;
      var state = { q: '', year: String(new Date().getFullYear()), sort: 'count' };

      (function skeletons() {
        var f = document.createDocumentFragment();
        for (var i = 0; i < 8; i++) {
          var c = document.createElement('div');
          c.className = 'card pulse';
          c.innerHTML =
            '<div class="who"><div class="skel" style="width:3.5rem;height:3.5rem;border-radius:.85rem"></div>' +
            '<div style="flex:1"><div class="skel" style="height:.85rem;width:70%;margin-bottom:.45rem"></div>' +
            '<div class="skel" style="height:.7rem;width:45%"></div></div></div>' +
            '<div class="skel" style="height:.75rem;margin-bottom:.45rem"></div>' +
            '<div class="skel" style="height:.75rem;width:80%"></div>';
          f.appendChild(c);
        }
        grid.appendChild(f);
      })();

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      var DATE_FMT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      function when(iso) {
        if (!iso) return 'N/A';
        var d = new Date(iso);
        return isNaN(d) ? 'N/A' : DATE_FMT.format(d);
      }

      function countFor(u, year) {
        return year === 'All Time' ? (u.total_contributions || 0)
                                   : ((u.years && u.years[year]) || 0);
      }

      function card(u) {
        var el = document.createElement('article');
        el.className = 'card';
        // Avatars lazy-load and decode off the main thread, with explicit
        // dimensions so the grid never reflows as they arrive.
        el.innerHTML =
          '<div class="who">' +
            '<a class="av-wrap" href="' + esc(u.profile_url) + '" target="_blank" rel="noopener noreferrer">' +
              '<img class="av" src="' + esc(u._avatar) + '" alt="" width="56" height="56" loading="lazy" decoding="async">' +
              '<span class="badge mono">' + u._n + '</span></a>' +
            '<div style="min-width:0">' +
              '<a href="' + esc(u.profile_url) + '" target="_blank" rel="noopener noreferrer">' +
                '<h3 class="name">' + esc(u.display_name || u.github_login) + '</h3></a>' +
              '<p class="login mono">@' + esc(u.github_login) + '</p></div></div>' +
          '<div class="stat"><span class="dot" style="background:var(--emerald)"></span>' +
            '<span class="label">Issues</span>' +
            '<span class="v">' + (u.open_issues || 0) + '</span><span class="k">open</span>' +
            '<span class="v">' + (u.closed_issues || 0) + '</span><span class="k">closed</span></div>' +
          '<div class="stat"><span class="dot" style="background:var(--violet)"></span>' +
            '<span class="label">Pull Requests</span>' +
            '<span class="v">' + (u.open_prs || 0) + '</span><span class="k">open</span>' +
            '<span class="v">' + (u.merged_prs || 0) + '</span><span class="k">merged</span></div>' +
          '<div class="foot"><span class="k">Last Active</span><span>' + when(u.last_contribution_date) + '</span></div>';
        return el;
      }

      function append(n) {
        var f = document.createDocumentFragment();
        var end = Math.min(shown + n, view.length);
        for (var i = shown; i < end; i++) f.appendChild(card(view[i]));
        grid.appendChild(f);          // one reflow per batch, not one per card
        shown = end;
        tail();
      }

      // The end of the list is now an explicit state rather than the spinner
      // silently disappearing, so it is obvious you have seen everyone.
      function tail() {
        if (!view.length) { sentinel.hidden = true; return; }
        sentinel.hidden = false;
        if (shown >= view.length) {
          sentinel.innerHTML = '<p class="tail">' +
            (view.length === all.length
              ? 'That’s everyone — all ' + view.length + ' contributors'
              : 'Showing all ' + view.length + ' matching contributors') +
            '</p>';
        } else {
          sentinel.innerHTML = '<div class="spinner"></div>';
        }
      }

      // IntersectionObserver only fires on TRANSITIONS. After appending a
      // batch the sentinel is often still inside the root margin — on a tall
      // window, a short result set, or when you scroll to the bottom quickly —
      // so no further callback arrives and loading stalls until you scroll up
      // and back down. That was the "stuck" behaviour. Keep topping up until
      // the sentinel is genuinely pushed out of range.
      function fill() {
        if (shown >= view.length) return;
        append(PAGE);
        requestAnimationFrame(function () {
          var r = sentinel.getBoundingClientRect();
          if (shown < view.length && r.top < window.innerHeight + 400) fill();
        });
      }

      function apply() {
        var q = state.q.toLowerCase();
        view = all.filter(function (u) {
          u._n = countFor(u, state.year);
          if (state.year !== 'All Time' && u._n === 0) return false;
          if (!q) return true;
          return (u.github_login || '').toLowerCase().indexOf(q) > -1 ||
                 (u.display_name || '').toLowerCase().indexOf(q) > -1;
        });

        view.sort(function (a, b) {
          if (state.sort === 'az') return (a.display_name || a.github_login).localeCompare(b.display_name || b.github_login);
          if (state.sort === 'recent') return new Date(b.last_contribution_date) - new Date(a.last_contribution_date);
          return b._n - a._n || (a.display_name || '').localeCompare(b.display_name || '');
        });

        grid.textContent = '';
        shown = 0;

        if (!view.length) {
          grid.innerHTML =
            '<div class="empty"><div class="empty-icon">' +
            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
            '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 8l6 6"/></svg></div>' +
            '<h3>No contributors found</h3><p>Try adjusting your search or filters.</p></div>';
          sentinel.hidden = true;
          return;
        }
        fill();
      }

      function press(container, attr, value) {
        var b = container.querySelectorAll('button');
        for (var i = 0; i < b.length; i++) {
          b[i].setAttribute('aria-pressed', String(b[i].getAttribute(attr) === value));
        }
      }

      var timer;
      qEl.addEventListener('input', function () {
        clearTimeout(timer);                 // debounced — re-filtering 200+
        timer = setTimeout(function () {     // records per keystroke was waste
          state.q = qEl.value.trim();
          apply();
        }, 120);
      });

      sortsEl.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        state.sort = b.getAttribute('data-sort');
        press(sortsEl, 'data-sort', state.sort);
        apply();
      });

      yearsEl.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        state.year = b.getAttribute('data-year');
        press(yearsEl, 'data-year', state.year);
        apply();
      });

      document.getElementById('theme').addEventListener('click', function () {
        var dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { }
      });

      new IntersectionObserver(function (en) {
        if (en[0].isIntersecting) fill();
      }, { rootMargin: '400px' }).observe(sentinel);

      function getJSON(u) {
        return fetch(u, { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error(u + ' -> ' + r.status);
          return r.json();
        });
      }

      Promise.all([
        getJSON('/issues-summary.json'),
        getJSON('/repo-stats.json').catch(function () { return null; })
      ]).then(function (res) {
        all = Array.isArray(res[0]) ? res[0] : [];
        var stats = res[1];

        all.forEach(function (u) {
          // avatar_local is written by scripts/issues_summary.py and served
          // same-origin; fall back to the GitHub CDN, then a neutral mark.
          u._avatar = u.avatar_local ? '/' + u.avatar_local
                    : (u.avatar_url || 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png');
        });

        function setNum(id, v) {
          var el = document.getElementById(id);
          if (el) el.textContent = (v == null ? 0 : v).toLocaleString();
        }

        function sum(field) {
          return all.reduce(function (s, u) { return s + (u[field] || 0); }, 0);
        }

        setNum('stat-contributors', all.length);
        setNum('stat-contributions', sum('total_contributions'));
        // repo-stats.json has open_issues but no closed_issues, so derive it
        // from the per-contributor totals.
        setNum('stat-closed', sum('closed_issues'));

        if (stats) {
          setNum('stat-stars', stats.total_stars);
          setNum('stat-forks', stats.total_forks);
          setNum('stat-open', stats.open_issues);
          setNum('stat-prs', stats.total_prs);
        }

        // Year buttons come from the data. `years` only exists once
        // issues_summary.yml has run with the updated script; until then this
        // collapses to a single "All Time" filter rather than rendering empty.
        var seen = {};
        all.forEach(function (u) { for (var y in (u.years || {})) seen[y] = 1; });
        var years = Object.keys(seen).sort().reverse();
        if (years.indexOf(state.year) === -1) state.year = years[0] || 'All Time';

        yearsEl.innerHTML = ['All Time'].concat(years).map(function (y) {
          return '<button data-year="' + y + '" aria-pressed="' + (y === state.year) + '">' + y + '</button>';
        }).join('');

        apply();
      }).catch(function (err) {
        fatal(err && err.message ? err.message : err);
      });
    })();
  </script>
</body>

</html>
